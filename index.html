<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Recorrido 360 &mdash; OmniPark</title>

<style>*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;font-family:'Montserrat',sans-serif;background:#000;overflow:hidden;}
#pano{position:absolute;inset:0;background:#111;}
#top{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(rgba(31,35,39,.85),transparent);color:#fff;pointer-events:none;}
#top .t{font-weight:800;font-size:16px;}
#sw{margin-left:auto;pointer-events:auto;background:#1F2327;color:#fff;border:1px solid #3a4046;border-radius:8px;padding:8px 10px;font:600 13px 'Montserrat';max-width:50vw;}

:root{--teal:#00B2C0;--teal-d:#008a95;--charcoal:#1F2327;}
#ov{position:absolute;inset:0;z-index:10;pointer-events:none;}
#ov .txt{fill:#fff;font-weight:700;font-family:'Montserrat',sans-serif;paint-order:stroke;stroke:#04252a;stroke-width:4px;}
#hs{position:absolute;inset:0;z-index:15;pointer-events:none;}
#hs>*{position:absolute;}
.flecha{pointer-events:auto;}
.handle{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#ffd54a;border:2px solid #04252a;z-index:22;cursor:grab;display:none;box-shadow:0 1px 4px rgba(0,0,0,.5);}
.handle.mid{background:#00B2C0;border-color:#fff;width:16px;height:16px;margin:-8px 0 0 -8px;}
.titulo{background:rgba(31,35,39,.85);color:#fff;border-left:3px solid var(--teal);padding:6px 11px;border-radius:6px;font-family:'Montserrat',sans-serif;font-weight:600;line-height:1.3;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.4);}
.titulo small{display:block;font-weight:400;color:#c7ced3;font-size:.78em;}
.texto{color:#fff;border:1.5px solid rgba(255,255,255,.6);border-radius:12px;padding:12px 15px;text-align:center;font-family:'Montserrat',sans-serif;font-weight:400;line-height:1.45;box-shadow:0 3px 14px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column;justify-content:center;}
.texto .tx-h{font-weight:700;margin-bottom:5px;font-size:1.07em;}
.texto .rz{position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;border-radius:3px;background:#ffd54a;border:2px solid #04252a;display:none;cursor:nwse-resize;z-index:5;}
.texto.selbox .rz{display:block;}
.flecha{display:flex;flex-direction:column;align-items:center;}
.flecha .fa{fill:none;stroke:#04252a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}
.flecha span{margin-top:3px;background:rgba(31,35,39,.9);color:#fff;font:600 12px 'Montserrat',sans-serif;padding:2px 9px;border-radius:11px;white-space:nowrap;}
.flecha .ibtn{border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.85);}
.flecha .ibtn svg{width:56%;height:56%;}
#drone{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:28;display:none;flex-direction:column;align-items:center;gap:3px;cursor:pointer;background:none;border:none;}
#drone .c{width:54px;height:54px;border-radius:50%;background:rgba(31,35,39,.55);border:2px solid #fff;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);box-shadow:0 3px 10px rgba(0,0,0,.4);}
#drone .c svg{width:30px;height:30px;}
#drone span{font:600 12px 'Montserrat',sans-serif;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.7);}
#drone:hover .c{border-color:var(--teal);}
body.textos-off .titulo,body.textos-off .texto{opacity:0;pointer-events:none;}
.titulo,.texto{transition:opacity .2s;}
#lc{position:absolute;left:16px;bottom:16px;z-index:26;display:flex;gap:8px;flex-wrap:wrap;max-width:62vw;}
#lc button{display:flex;align-items:center;gap:7px;background:var(--charcoal);color:#fff;border:1px solid #3a4046;padding:10px 15px;border-radius:30px;font:600 13px 'Montserrat',sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);}
#lc button.on{background:var(--teal);color:#04252a;border-color:var(--teal);}
#lc .dot{width:9px;height:9px;border-radius:50%;background:#6b7278;}#lc button.on .dot{background:#04252a;}
#actions{position:absolute;right:16px;bottom:16px;z-index:26;display:flex;gap:8px;}
#actions button{align-items:center;justify-content:center;gap:6px;background:var(--charcoal);color:#fff;border:1px solid #3a4046;border-radius:30px;padding:10px 14px;font:600 14px 'Montserrat',sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);}
#actions #btnAudio{display:none;}#actions button.on{background:var(--teal);color:#04252a;border-color:var(--teal);}
#actions svg{width:20px;height:20px;display:block;}

#intro{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(180deg,#cfe4f2,#eaf3f9 60%,#dcebf4);transition:opacity 1s;}
#intro.hide{opacity:0;pointer-events:none;}
#intro #planet{position:absolute;left:50%;top:50%;width:min(74vh,74vw);height:min(74vh,74vw);transform:translate(-50%,-50%) rotate(0deg);animation:spin 50s linear infinite;filter:drop-shadow(0 24px 50px rgba(0,0,0,.28));}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg);}}
#intro.dive #planet{animation:none;transition:transform 1.8s cubic-bezier(.5,0,.75,.3),opacity 1.8s;transform:translate(-50%,-50%) scale(3.6) rotate(28deg);opacity:0;}
#intro .ibox{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:16px;}
#intro.dive .ibox{transition:opacity .5s;opacity:0;}
#intro .ibrand{font-weight:800;font-size:30px;letter-spacing:3px;color:#1F2327;text-shadow:0 2px 14px rgba(255,255,255,.55);}
#intro .ibrand b{color:var(--teal);}
#intro #iplay{width:94px;height:94px;border-radius:50%;background:var(--teal);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 34px rgba(0,120,130,.45);transition:transform .15s;}
#intro #iplay:hover{transform:scale(1.07);}
#intro #iplay svg{width:40px;height:40px;margin-left:5px;}
#intro .ihint{color:#1F2327;font:700 13px 'Space Mono',monospace;letter-spacing:2px;text-transform:uppercase;}
